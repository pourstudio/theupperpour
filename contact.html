<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — The Upper Pour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Josefin+Sans:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #EDE8E1;
      --crimson:    #8B1A2B;
      --burgundy:   #A0223A;
      --near-black: #1A1A1A;
      --warm-gray:  #C9C2B8;
      --warm-white: #F7F3EE;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--near-black);
      font-family: 'Josefin Sans', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 18px 48px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(237,232,225,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(139,26,43,0.12);
    }
    .nav-logo {
      font-family: 'Satisfy', cursive;
      font-size: 1.5rem;
      color: var(--crimson);
      letter-spacing: -0.5px;
      text-decoration: none;
    }
    .nav-links {
      display: flex; gap: 32px; list-style: none;
    }
    .nav-links a {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--near-black);
      text-decoration: none;
      opacity: 0.65;
      transition: opacity 0.2s, color 0.2s;
    }
    .nav-links a:hover,
    .nav-links a.active { opacity: 1; color: var(--crimson); }

    /* ── MAIN WRAP ── */
    .page-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
    }

    /* ── HERO TEXT ── */
    .hero-eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--crimson);
      opacity: 0.7;
      margin-bottom: 14px;
      text-align: center;
      animation: fadeUp 0.8s ease both;
    }
    .hero-title {
      font-family: 'Satisfy', cursive;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      color: var(--crimson);
      text-align: center;
      margin-bottom: 8px;
      animation: fadeUp 0.85s 0.08s ease both;
    }
    .hero-sub {
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--near-black);
      opacity: 0.4;
      text-align: center;
      margin-bottom: 48px;
      animation: fadeUp 0.85s 0.15s ease both;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 48px;
      animation: fadeUp 0.85s 0.2s ease both;
    }
    .divider-line { flex: 1; height: 1px; background: var(--warm-gray); }
    .divider-mark {
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--crimson);
      opacity: 0.5;
    }

    /* ── FORM ── */
    form {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      animation: fadeUp 0.9s 0.25s ease both;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--near-black);
      opacity: 0.55;
    }

    input, textarea, select {
      background: var(--warm-white);
      border: 1px solid var(--warm-gray);
      border-radius: 0;
      padding: 13px 16px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: var(--near-black);
      outline: none;
      transition: border-color 0.22s, box-shadow 0.22s;
      width: 100%;
      -webkit-appearance: none;
    }
    input::placeholder, textarea::placeholder { color: var(--warm-gray); }
    input:focus, textarea:focus, select:focus {
      border-color: var(--crimson);
      box-shadow: 0 0 0 3px rgba(139,26,43,0.08);
    }

    textarea { resize: vertical; min-height: 130px; }

    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '↓';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--crimson);
      pointer-events: none;
      font-size: 0.8rem;
      opacity: 0.6;
    }
    select { cursor: pointer; }

    button[type="submit"] {
      align-self: flex-start;
      padding: 13px 36px;
      background: var(--crimson);
      color: var(--cream);
      border: none;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.22s, transform 0.18s;
    }
    button[type="submit"]:hover {
      background: var(--burgundy);
      transform: translateY(-1px);
    }
    button[type="submit"]:active { transform: translateY(0); }

    /* success state */
    .success {
      display: none;
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 48px 32px;
      background: var(--warm-white);
      border: 1px solid var(--warm-gray);
    }
    .success-icon {
      font-family: 'Satisfy', cursive;
      font-size: 2.5rem;
      color: var(--crimson);
      margin-bottom: 16px;
    }
    .success p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--near-black);
      opacity: 0.65;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--cream);
      border-top: 1px solid rgba(139,26,43,0.14);
      padding: 32px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-brand {
      font-family: 'Satisfy', cursive;
      font-size: 1.4rem;
      color: var(--crimson);
    }
    .footer-copy {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--near-black);
      opacity: 0.28;
      margin-top: 4px;
    }
    .footer-link {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--crimson);
      text-decoration: none;
      opacity: 0.65;
      transition: opacity 0.2s;
    }
    .footer-link:hover { opacity: 1; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      nav { padding: 16px 24px; }
      .nav-links { gap: 20px; }
      footer { padding: 24px; flex-wrap: wrap; gap: 16px; }
    }
    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
      button[type="submit"] { align-self: stretch; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-logo">the upper pour</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <!-- PAGE CONTENT -->
  <div class="page-wrap">

    <p class="hero-eyebrow">✦ &nbsp; reach us &nbsp; ✦</p>
    <h1 class="hero-title">Get in Touch</h1>
    <p class="hero-sub">We'd love to hear from you</p>

    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-mark">Est. 2026</span>
      <span class="divider-line"></span>
    </div>

    <form id="contactForm" novalidate>

      <div class="row">
        <div class="field">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" placeholder="Your name" required />
        </div>
        <div class="field">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" placeholder="Your surname" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="hello@example.com" required />
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <div class="select-wrap">
          <select id="subject" name="subject">
            <option value="" disabled selected>Select a topic</option>
            <option>Reservations &amp; Events</option>
            <option>Menu Inquiry</option>
            <option>Wholesale &amp; Partnerships</option>
            <option>Feedback</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell us anything…" required></textarea>
      </div>

      <button type="submit">Send Message</button>
    </form>

    <div class="success" id="successMsg">
      <div class="success-icon">the upper pour</div>
      <p>Thank you. We'll be in touch soon.</p>
    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    <div>
      <div class="footer-brand">the upper pour</div>
      <div class="footer-copy">© 2026 The Upper Pour. All rights reserved.</div>
    </div>
    <a href="about.html" class="footer-link">Our Story →</a>
  </footer>

  <script>
    const form = document.getElementById('contactForm');
    const success = document.getElementById('successMsg');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      form.style.transition = 'opacity .35s';
      form.style.opacity = '0';
      setTimeout(() => {
        form.style.display = 'none';
        success.style.display = 'block';
        success.style.opacity = '0';
        success.style.transition = 'opacity .35s';
        requestAnimationFrame(() => { success.style.opacity = '1'; });
      }, 350);
    });
  </script>

</body>
</html>
